<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily planner</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <script src='https://cdn.jsdelivr.net/npm/animejs@3.2.1/lib/anime.min.js' defer></script>
</head>

<body>
    <header>
        <div class="hea">
            <h1>
                Daily planner
            </h1>
        </div>
    </header>
    <main>
        <div class="poom">
            <input type="text" class="inner_task"></input>
            <button class="button1 btn-10 custom-btn"><a>✔</a></button>
        </div>
        <div class="blocks">
            <div class="block" id="todo-board">
                <h2 class="section-name">task</h2>

                <div class="task-list" id="todo-list">

                </div>


                <div class="button2"></div>
            </div>
            <div class="block" id="inprogress-board">
                <h2 class="section-name">in process</h2>

                <div class="task-list" id="inprogress-list">

                </div>

                <div class="button2"></div>
            </div>
            <div class="block">
                <h2 class="section-name" id="done-board">done</h2>
                <div class="task-list" id="done-list">

                </div>

            </div>
        </div>
    </main>
</body>

</html>
