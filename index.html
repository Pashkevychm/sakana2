<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily planner</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <div class="hea">
            <h1>
                Daily planner
            </h1> 
        </div>
    </header>
    <main>
        <div class="poom">
            <div class="inner_task"></div>
            <div class="button1"><a>✔</a></div>
        </div>
        <div class="blocks">
            <div class="block">
                <h2 class="section-name">task</h2>
                <div class="task">Task1</div>
                <div class="task">Task2</div>
                <div class="button2"></div>
            </div>
            <div class="block">
                <h2 class="section-name">in process</h2>
                <div class="task">Task1</div>
                <div class="task">Task2</div>
                <div class="button2"></div>
            </div>
            <div class="block">
                <h2 class="section-name">done</h2>
                <div class="task">Task1</div>
                <div class="task">Task2</div>
            </div>
        </div>
    </main>
</body>
</html>
